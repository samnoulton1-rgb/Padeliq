name: Update padel club directory

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Europe/London"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: club-directory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate directory rules
        run: python -m unittest scripts/test_update_club_directory.py -v
      - name: Refresh public venue data
        run: python scripts/update_club_directory.py --respect-interval
      - name: Commit changes only when the directory changed
        run: |
          if git diff --quiet -- data/club-directory.json; then
            echo "No directory changes found."
            exit 0
          fi
          git config user.name "PadelIQ directory bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/club-directory.json
          git commit -m "Refresh padel club directory"
          git push
